<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>논문조사 데이터 응답시간점검</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #FAF9F5; --panel: #FFFFFF; --line: #E8E6DC; --line2: #F0EEE6;
    --text: #1F1E1B; --mid: #5E5D59; --muted: #8F8D85;
    --accent: #C96442; --accent-bg: #F7EDE7; --accent-dk: #A9512F;
    --ok: #3D7A57; --ok-bg: #EAF3EC; --warn: #B4532A; --warn-bg: #FBEEE6;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-family: inherit; font-weight: 700; font-size: 28px;
    letter-spacing: -0.01em; margin: 0 0 6px; }
  .sub { color: var(--mid); margin: 0 0 28px; }
  .rules { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .rule { background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; font-size: 12.5px; color: var(--mid); }
  .rule b { color: var(--accent); font-weight: 600; margin-right: 4px; }

  .drop { display: block; background: var(--panel); border: 1.5px dashed #D6D3C7; border-radius: var(--radius);
    padding: 34px 20px; text-align: center; cursor: pointer; transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: #FFFCFA; }
  .drop .big { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .drop .small { color: var(--muted); font-size: 12.5px; }
  .drop input { display: none; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px 22px; margin-top: 18px; }
  .file-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .file-name { font-weight: 600; word-break: break-all; }
  .file-meta { color: var(--muted); font-size: 12.5px; }
  .spacer { flex: 1; }
  .btn { appearance: none; border: 0; border-radius: 9px; padding: 9px 16px; font: inherit;
    font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; transition: .15s; }
  .btn:hover { background: var(--accent-dk); }
  .btn:disabled, .btn[aria-disabled="true"] { background: #D9D6CC; cursor: default; pointer-events: none; }
  a.btn { text-decoration: none; display: inline-block; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 24px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 12.5px; color: var(--muted); font-weight: 500; margin-left: 3px; }
  .stat.a .v { color: var(--accent); }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 25px; } }

  .sheets { margin: 10px 0 0; padding: 0; list-style: none; color: var(--mid); font-size: 13px; }
  .sheets li { padding: 3px 0; }
  .sheets li::before { content: "·"; color: var(--accent); font-weight: 700; margin-right: 8px; }
  .tag { display: inline-block; font-size: 11.5px; border-radius: 6px; padding: 1px 7px; margin-left: 6px;
    background: var(--line2); color: var(--mid); }
  .tag.new { background: var(--accent-bg); color: var(--accent-dk); }

  details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 12px; }
  summary { cursor: pointer; padding: 14px 20px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "›"; color: var(--muted); font-size: 18px; line-height: 1; transition: .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  summary .cnt { color: var(--muted); font-weight: 500; }
  .tbl-wrap { max-height: 420px; overflow: auto; border-top: 1px solid var(--line2); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line2); vertical-align: top; }
  th { position: sticky; top: 0; background: #FCFBF8; color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; }
  td.ans { word-break: break-all; max-width: 280px; }
  .pill { font-size: 11.5px; border-radius: 6px; padding: 1px 7px; background: var(--accent-bg); color: var(--accent-dk); white-space: nowrap; }
  .pill.g { background: var(--line2); color: var(--mid); }
  .empty { padding: 16px 20px; color: var(--muted); border-top: 1px solid var(--line2); }

  .pick-h { margin-top: 16px; font-weight: 600; font-size: 13.5px; }
  .card > .pick-h:first-child { margin-top: 0; }
  .pick-h .cnt { color: var(--muted); font-weight: 500; font-size: 12.5px; margin-left: 6px; }
  .pks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .pk { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 12px; cursor: pointer; font-size: 13px; background: #FCFBF8; transition: .15s; user-select: none; }
  .pk:hover { border-color: #D6D3C7; }
  .pk:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
  .pk input { accent-color: var(--accent); margin: 0; width: 15px; height: 15px; }
  .pk .tag { margin-left: 0; }
  .empty-pick { color: var(--muted); text-align: center; }

  .keepnote { color: var(--mid); font-size: 12.5px; margin: 12px 2px 0; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 26px; text-align: center; }

  .modal-bg { position: fixed; inset: 0; background: rgba(31,30,27,.35); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--panel); border-radius: 14px; max-width: 440px; width: 100%; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
  .modal h3 { margin: 0 0 8px; font-size: 16px; color: var(--warn); }
  .modal p { margin: 0 0 18px; color: var(--mid); white-space: pre-line; }
  .modal .row { text-align: right; }
  .busy { color: var(--muted); font-size: 13px; margin-top: 14px; display: none; }
  .busy.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>논문조사 데이터 응답시간점검</h1>
  <p class="sub">rawdata 엑셀을 넣으면 QDEL에 응답시간 하위 3%와 불량 오픈응답을 표시해 드려요.</p>

  <div class="rules">
    <span class="rule"><b>9990</b>intval 하위 3% (올림, 동점은 no 순)</span>
    <span class="rule"><b>9998</b>오픈응답(TS·TL) 불량 패턴</span>
    <span class="rule">둘 다 해당되면 9990</span>
    <span class="rule">나머지는 기존 qdel 유지</span>
  </div>

  <label class="drop" id="drop">
    <div class="big">엑셀 파일을 끌어다 놓거나 클릭해서 선택</div>
    <div class="small">.xlsx · 파일은 이 브라우저 안에서만 처리되고 어디에도 올라가지 않아요</div>
    <input type="file" id="file" accept=".xlsx">
  </label>
  <div class="busy" id="busy">파일을 읽는 중이에요…</div>

  <div id="out"></div>

  <p class="note">원본 시트는 그대로 두고 <b>rawdata(응답시간점검)</b> 시트를 맨 앞에 추가해요. PreprocessingData 시트가 있으면 <b>PreprocessingData(응답시간점검)</b>도 함께 추가해요.</p>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="m-title">확인이 필요해요</h3>
    <p id="m-body"></p>
    <div class="row"><button class="btn" id="m-ok">확인</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ── 불량 패턴 (사용자 지정 원문 그대로, JS 정규식) ──
const PATTERNS = [
  { no: 2, re: /^[ㄱ-ㅎ]+$/,                 label: "자음만" },
  { no: 3, re: /^[ㅏ-ㅣ]+$/,                 label: "모음만" },
  { no: 4, re: /^([a-zA-Z])\1{2,}$/,         label: "같은 알파벳 3번 이상 반복" },
  { no: 5, re: /^[^a-zA-Z0-9가-힣]+$/,        label: "기호만" },
  { no: 6, re: /^\d+$/,                      label: "숫자만" },
  { no: 7, re: /^(?:[\uD83C-\uDBFF][\uDC00-\uDFFF]|[☀-⛿✀-➿])+$/, label: "이모지만" },
];
const OPEN_RE = /T[LS]\d+$/i;
const RAW_RE = /^RowData\s*\d+\s*차/i;
const PP_RE = /PreprocessingData/i;
const OUT_RAW = "rawdata(응답시간점검)";
const OUT_PP = "PreprocessingData(응답시간점검)";

function showModal(title, body) {
  $("m-title").textContent = title; $("m-body").textContent = body;
  $("modal").classList.add("show");
}
$("m-ok").onclick = () => $("modal").classList.remove("show");

// ── 파일 입력 ──
const drop = $("drop");
["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => { const f = ev.dataTransfer.files[0]; if (f) handle(f); });
$("file").addEventListener("change", ev => { const f = ev.target.files[0]; if (f) handle(f); ev.target.value = ""; });

function colIndex(header, name) {
  const n = name.toLowerCase();
  return header.findIndex(h => String(h ?? "").trim().toLowerCase() === n);
}
function toNum(v) {
  if (v === null || v === undefined) return NaN;
  const s = String(v).trim(); if (s === "") return NaN;
  return Number(s);
}
function ceil3pct(n) { const x = n * 3; return (x - x % 100) / 100 + (x % 100 ? 1 : 0); }  // 정수 연산 올림

async function handle(file) {
  $("out").innerHTML = ""; $("busy").classList.add("show");
  try {
    if (!/\.xlsx$/i.test(file.name)) throw new UserError("xlsx 파일만 넣을 수 있어요.", "파일 형식 확인");
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: false });
    const rawNames = wb.SheetNames.filter(n => RAW_RE.test(n));
    if (!rawNames.length) throw new UserError("'RowData N차(재정렬)' 시트를 찾지 못했어요.\n시트 이름을 확인해 주세요.", "RowData 시트 없음");
    window._cur = { file, buf, wb, rawNames, sel: new Set(rawNames) };   // 기본: 전체 선택
    run();
  } catch (e) {
    if (e instanceof UserError) showModal(e.title, e.message);
    else { console.error(e); showModal("처리 중 오류", String(e && e.message || e)); }
  } finally { $("busy").classList.remove("show"); }
}

// 선택된 RowData 시트로 판정 → 화면 갱신 (체크 바꿀 때마다 다시 실행)
function run() {
  const C = window._cur; if (!C) return;
  const picked = C.rawNames.filter(n => C.sel.has(n));
  if (!picked.length) { renderPicker(C); $("dl").textContent = "시트를 선택해 주세요"; $("res").innerHTML = `<div class="card empty-pick">데이터 시트를 하나 이상 선택해 주세요.</div>`; return; }
  try { render(C.file, C.buf, analyze(C.wb, picked)); }
  catch (e) {
    renderPicker(C); $("dl").textContent = "실행 안 함"; $("res").innerHTML = "";
    if (e instanceof UserError) showModal(e.title, e.message);
    else { console.error(e); showModal("처리 중 오류", String(e && e.message || e)); }
  }
}
function renderPicker(C) {
  if (!$("res")) $("out").innerHTML = `<div id="pick"></div><div id="res"></div>`;
  const items = C.rawNames.map((n, i) => {
    const ws = C.wb.Sheets[n]; const rng = ws && ws["!ref"] ? XLSX.utils.decode_range(ws["!ref"]) : null;
    const cnt = rng ? rng.e.r - rng.s.r : 0;
    return `<label class="pk"><input type="checkbox" data-i="${i}" ${C.sel.has(n) ? "checked" : ""}><span>${esc(n)}</span><span class="tag">약 ${cnt}행</span></label>`;
  }).join("");
  $("pick").innerHTML = `
    <div class="card">
      <div class="file-row">
        <div><div class="file-name">${esc(C.file.name)}</div><div class="file-meta">${(C.file.size/1024).toFixed(0)} KB</div></div>
        <div class="spacer"></div>
        <a class="btn" id="dl" aria-disabled="true">결과 파일 준비 중…</a>
      </div>
      <div class="pick-h">판정에 쓸 데이터 시트 <span class="cnt">${C.sel.size}/${C.rawNames.length}개 선택 · 선택한 시트만 합쳐서 판정해요</span></div>
      <div class="pks">${items}</div>
    </div>`;
  $("pick").querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => {
    const n = C.rawNames[+cb.dataset.i];
    cb.checked ? C.sel.add(n) : C.sel.delete(n);
    run();
  }));
}
class UserError extends Error { constructor(msg, title) { super(msg); this.title = title || "확인이 필요해요"; } }

// 행 번호를 보존하기 위해 빈 행도 포함해서 읽음 (data[i] = 엑셀 행 base.r + i + 1)
function sheetRows(ws) {
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
}
function sheetBase(ws) { return ws && ws["!ref"] ? XLSX.utils.decode_range(ws["!ref"]).s : { r: 0, c: 0 }; }
const hasVal = v => v !== null && v !== undefined && String(v).trim() !== "";
// 열(col)의 기존 값이 텍스트인지: 값 있는 셀만 세고, 없으면 시트 전체 다수 형식
function qdelIsText(data, col) {
  let t = 0, n = 0, at = 0, an = 0;
  for (let d = 1; d < data.length; d++) for (let c = 0; c < (data[d] || []).length; c++) {
    const v = data[d][c]; if (!hasVal(v)) continue;
    const isT = typeof v === "string"; if (c === col) isT ? t++ : n++; isT ? at++ : an++;
  }
  return t + n ? t >= n : at >= an;
}
const isBlankRow = r => !r || !r.some(v => v !== null && String(v).trim() !== "");
// 같은 이름 열이 여러 개여도 섞이지 않게 "이름+몇 번째"로 키를 만듦
function headerKeys(h) { const seen = {}; return h.map(c => { const k = c.trim().toLowerCase(); seen[k] = (seen[k] || 0) + 1; return k + "\u0001" + seen[k]; }); }

// ── 판정 ──
function analyze(wb, rawNames) {
  rawNames = rawNames || wb.SheetNames.filter(n => RAW_RE.test(n));
  const ppName = wb.SheetNames.find(n => PP_RE.test(n) && !n.includes("응답시간점검"));
  if (!rawNames.length) throw new UserError("'RowData N차(재정렬)' 시트를 찾지 못했어요.\n시트 이름을 확인해 주세요.", "RowData 시트 없음");

  // RowData 시트 합치기 (헤더 이름 기준으로 열 맞춤)
  let header = null, keys = null; const rows = [], meta = [], parts = [];
  for (const name of rawNames) {
    const ws = wb.Sheets[name]; const data = sheetRows(ws); const base = sheetBase(ws);
    if (!data.length) continue;
    const h = data[0].map(x => x === null ? "" : String(x));
    if (colIndex(h, "intval") < 0)
      throw new UserError(`'${name}' 시트에 intval 변수가 없어요.\n응답시간 기준은 intval만 사용하므로 실행하지 않았어요.`, "intval 없음");
    const hk = headerKeys(h);
    if (!header) { header = h.slice(); keys = hk.slice(); }
    hk.forEach((k, i) => { if (!keys.includes(k)) { keys.push(k); header.push(h[i]); } });
    const map = hk.map(k => keys.indexOf(k));   // 원본 열 → 결과 열
    const pi = parts.length; let cnt = 0;
    for (let d = 1; d < data.length; d++) {
      const r = data[d]; if (isBlankRow(r)) continue;
      const out = new Array(header.length).fill(null);
      r.forEach((v, i) => { if (i < map.length) out[map[i]] = v; });
      rows.push(out); meta.push({ p: pi, r: base.r + d + 1 }); cnt++;
    }
    parts.push({ name, n: cnt, map, baseC: base.c, hdrRow: base.r + 1, qTxt: qdelIsText(data, colIndex(h, "qdel")) });
  }
  rows.forEach(r => { while (r.length < header.length) r.push(null); });

  const iNo = colIndex(header, "no"), iId = colIndex(header, "id"), iInt = colIndex(header, "intval"), iQdel = colIndex(header, "qdel");
  if (iQdel < 0) throw new UserError("RowData 시트에 qdel 변수가 없어요.", "qdel 없음");
  if (iId < 0) throw new UserError("RowData 시트에 id 변수가 없어요.", "id 없음");
  const openCols = header.map((h, i) => [h, i]).filter(([h]) => OPEN_RE.test(h));

  const n = rows.length, k = ceil3pct(n);
  // 1) intval 하위 3%
  const badInt = rows.filter(r => isNaN(toNum(r[iInt]))).length;
  const order = rows.map((r, i) => i).sort((a, b) => {
    const x = toNum(rows[a][iInt]), y = toNum(rows[b][iInt]);
    const xa = isNaN(x) ? Infinity : x, ya = isNaN(y) ? Infinity : y;
    if (xa !== ya) return xa - ya;
    const na = toNum(rows[a][iNo]), nb = toNum(rows[b][iNo]);
    return (isNaN(na) ? Infinity : na) - (isNaN(nb) ? Infinity : nb) || a - b;
  });
  const flag = new Array(n).fill(null);
  const lowList = order.slice(0, k).map((i, rank) => { flag[i] = 9990; return { i, rank: rank + 1 }; });
  const cutVal = k ? toNum(rows[order[k - 1]][iInt]) : null;

  // 2) 불량 오픈응답
  const badList = [];
  rows.forEach((r, i) => {
    for (const [h, c] of openCols) {
      const v = r[c]; if (v === null || v === undefined) continue;
      const s = String(v).trim(); if (!s) continue;
      const p = PATTERNS.find(p => p.re.test(s));
      if (p) badList.push({ i, col: h, ans: s, p });
    }
  });
  const badRows = new Set(badList.map(b => b.i));
  badRows.forEach(i => { if (flag[i] !== 9990) flag[i] = 9998; });

  // PreprocessingData: id로 매칭 (행 번호 → qdel 값)
  let pp = null;
  if (ppName) {
    const ws = wb.Sheets[ppName]; const data = sheetRows(ws); const base = sheetBase(ws);
    const h = (data[0] || []).map(x => x === null ? "" : String(x));
    const jId = colIndex(h, "id"), jQdel = colIndex(h, "qdel");
    if (jId < 0 || jQdel < 0) throw new UserError(`'${ppName}' 시트에 id 또는 qdel 변수가 없어요.`, "PreprocessingData 확인");
    const byId = new Map(rows.map((r, i) => [String(r[iId] ?? "").trim(), flag[i]]));
    let matched = 0, unmatched = 0, n9990 = 0, n9998 = 0; const byRow = new Map();
    for (let d = 1; d < data.length; d++) {
      const r = data[d]; if (isBlankRow(r)) continue;
      const key = String(r[jId] ?? "").trim(); let f = null;
      if (byId.has(key)) { matched++; f = byId.get(key); } else unmatched++;
      if (f === 9990) n9990++; if (f === 9998) n9998++;
      byRow.set(base.r + d + 1, f);
    }
    pp = { name: ppName, qTxt: qdelIsText(data, jQdel), qdelCol: base.c + jQdel, hdrRow: base.r + 1, byRow, matched, unmatched, n9990, n9998 };
  }

  return { rawNames, parts, header, rows, meta, n, k, cutVal, badInt, iNo, iId, iInt, iQdel, openCols, lowList, badList, flag, pp,
           n9990: flag.filter(f => f === 9990).length, n9998: flag.filter(f => f === 9998).length,
           kept: rows.filter((r, i) => flag[i] === null && hasVal(r[iQdel])).length,
           over: rows.filter((r, i) => flag[i] !== null && hasVal(r[iQdel]) && String(r[iQdel]).trim() !== String(flag[i])).length };
}

// ── 화면 ──
function render(file, buf, R) {
  window._last = { buf, R };   // 점검용
  const none = R.n - R.n9990 - R.n9998 - R.kept;
  const low = R.lowList.map(({ i, rank }) => {
    const r = R.rows[i];
    return `<tr><td class="num">${rank}</td><td class="num">${esc(r[R.iNo])}</td><td>${esc(r[R.iId])}</td><td class="num">${esc(r[R.iInt])}</td></tr>`;
  }).join("");
  const bad = R.badList.map(b => {
    const r = R.rows[b.i]; const is90 = R.flag[b.i] === 9990;
    return `<tr><td class="num">${esc(r[R.iNo])}</td><td>${esc(r[R.iId])}</td><td>${esc(b.col)}</td><td class="ans">${esc(b.ans)}</td>
      <td><span class="pill">${b.p.no}. ${esc(b.p.label)}</span>${is90 ? ' <span class="pill g">9990 우선</span>' : ""}</td></tr>`;
  }).join("");
  const sheetList = R.parts.map(p => `<li>${esc(p.name)} <span class="tag">${p.n}명</span></li>`).join("")
    + (R.parts.length > 1 ? `<li>위 ${R.parts.length}개 시트를 합쳐서 판정했어요</li>` : "")
    + (R.pp ? `<li>${esc(R.pp.name)} <span class="tag">id 매칭 ${R.pp.matched}명${R.pp.unmatched ? ` · 미매칭 ${R.pp.unmatched}명(선택 안 한 시트 응답자 등 → 기존 qdel 유지)` : ""}</span></li>` : "")
    + `<li>오픈응답 변수 ${R.openCols.length}개 검사 <span class="tag">${esc(R.openCols.map(c => c[0]).join(", ")) || "없음"}</span></li>`
    + `<li>추가될 시트 <span class="tag new">${OUT_RAW}</span>${R.pp ? ` <span class="tag new">${OUT_PP}</span>` : ""}</li>`;

  if (window._cur && window._cur.file === file) renderPicker(window._cur);
  else $("out").innerHTML = `<div id="pick"><div class="card"><div class="file-row"><div class="file-name">${esc(file.name)}</div><div class="spacer"></div><a class="btn" id="dl" aria-disabled="true">결과 파일 준비 중…</a></div></div></div><div id="res"></div>`;
  $("res").innerHTML = `
    <div class="card">
      <div class="pick-h">판정 내용</div>
      <ul class="sheets">${sheetList}</ul>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">전체 응답자</div><div class="v">${R.n}<small>명</small></div></div>
      <div class="stat a"><div class="k">9990 · 응답시간 3%</div><div class="v">${R.n9990}<small>명</small></div></div>
      <div class="stat a"><div class="k">9998 · 불량응답</div><div class="v">${R.n9998}<small>명</small></div></div>
      <div class="stat"><div class="k">기존 qdel 값 유지</div><div class="v">${R.kept}<small>명</small></div></div>
    </div>
    <p class="keepnote">이번 점검에 걸린 응답자만 qdel을 9990·9998로 바꾸고, 나머지는 원래 qdel 값을 그대로 둬요. 원래 비어 있던 ${none}명은 빈값 그대로예요.${R.over ? ` 기존 값이 있었는데 이번 점검으로 바뀐 응답자 ${R.over}명.` : ""}</p>
    <details open>
      <summary>응답시간 하위 3% <span class="cnt">${R.n}명 × 3% = ${(R.n*0.03).toFixed(2)} → 올림 ${R.k}명 · 기준 intval ≤ ${esc(R.cutVal)}</span></summary>
      ${low ? `<div class="tbl-wrap"><table><thead><tr><th>순위</th><th>no</th><th>id</th><th>intval</th></tr></thead><tbody>${low}</tbody></table></div>` : `<div class="empty">해당 없음</div>`}
    </details>
    <details open>
      <summary>불량 오픈응답 <span class="cnt">${R.badList.length}건 · ${new Set(R.badList.map(b => b.i)).size}명</span></summary>
      ${bad ? `<div class="tbl-wrap"><table><thead><tr><th>no</th><th>id</th><th>문항</th><th>응답</th><th>패턴</th></tr></thead><tbody>${bad}</tbody></table></div>` : `<div class="empty">걸린 응답이 없어요</div>`}
    </details>`;
  if (R.badInt) showModal("intval 값 확인", `intval이 비었거나 숫자가 아닌 응답자가 ${R.badInt}명 있어요.\n이 응답자는 3% 순위에서 맨 뒤로 보냈어요.`);
  // 결과 파일을 미리 만들어 두고, 버튼은 바로 내려받는 링크로 (클릭 후 비동기 생성 시 다운로드 차단 방지)
  const dl = $("dl");
  buildOutput(buf, R).then(blob => {
    dl.href = URL.createObjectURL(blob);
    dl.download = file.name.replace(/\.xlsx$/i, "") + "_응답시간점검.xlsx";
    dl.removeAttribute("aria-disabled"); dl.textContent = "결과 엑셀 받기";
  }).catch(e => { console.error(e); dl.textContent = "파일 만들기 실패"; showModal("파일 만들기 오류", String(e && e.message || e)); });
}

// ── 원본 zip에 시트 추가 (원본 시트·서식 그대로 유지) ──
const NS_MAIN = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
const NS_R = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const NS_PKG = "http://schemas.openxmlformats.org/package/2006/relationships";
const T_WS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet";
const CT_WS = "application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml";

// ── 원본 시트 XML의 셀을 그대로 복사 (값·서식·공유문자열 번호까지 동일), qdel 셀만 교체 ──
function colName(i) { let s = ""; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; }
function colNum(L) { let n = 0; for (const ch of L) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; }
const attr = (a, k) => { const m = a.match(new RegExp(`(?:^|\\s)${k}="([^"]*)"`)); return m ? m[1] : null; };
const dropAttr = (a, k) => a.replace(new RegExp(`\\s${k}="[^"]*"`, "g"), "");
// 시트 XML → { head, views, fmt, cols, margins, rows: Map(행번호 → {a: 행속성, cells: Map(열번호 → {a, inner})}) }
function parseSheet(x) {
  const pick = re => { const m = x.match(re); return m ? m[0] : ""; };
  const w0 = x.indexOf("<worksheet");
  const head = x.slice(w0, x.indexOf(">", w0) + 1).replace(/\sxr:uid="[^"]*"/, "");
  const sd = x.match(/<sheetData[^>]*?(?:\/>|>([\s\S]*)<\/sheetData>)/);
  const rows = new Map(); let rn = 0;
  const reRow = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g, reC = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
  let m; while (sd && sd[1] && (m = reRow.exec(sd[1]))) {
    const ra = m[1]; rn = +(attr(ra, "r") || rn + 1);
    const cells = new Map(); let cn = -1, c;
    reC.lastIndex = 0;
    while ((c = reC.exec(m[2] || ""))) {
      const ref = attr(c[1], "r"); cn = ref ? colNum(ref.replace(/\d+$/, "")) : cn + 1;
      cells.set(cn, { a: c[1], inner: c[2] });
    }
    rows.set(rn, { a: ra, cells });
  }
  return { head, rows,
    views: pick(/<sheetViews>[\s\S]*?<\/sheetViews>/).replace(/\stabSelected="1"/g, ""),
    fmt: pick(/<sheetFormatPr\b[^>]*\/>/), cols: pick(/<cols>[\s\S]*?<\/cols>/), margins: pick(/<pageMargins\b[^>]*\/>/) };
}
function cellXml(cell, ref, newVal, asText) {   // newVal: undefined=원본 그대로, null=빈값, 숫자=교체
  const a = cell ? dropAttr(cell.a, "r").replace(/\s\/$/, "") : "";
  if (newVal === undefined) {
    const inner = (cell.inner || "").replace(/<f\b[^>]*\/>|<f\b[^>]*>[\s\S]*?<\/f>/g, "");  // 수식은 계산된 값만 남김
    return inner ? `<c r="${ref}"${a}>${inner}</c>` : `<c r="${ref}"${a}/>`;
  }
  const s = cell && attr(cell.a, "s"); const sa = s ? ` s="${s}"` : "";
  if (newVal === null) return sa ? `<c r="${ref}"${sa}/>` : "";
  return asText ? `<c r="${ref}"${sa} t="inlineStr"><is><t>${newVal}</t></is></c>` : `<c r="${ref}"${sa}><v>${newVal}</v></c>`;
}
function rowXml(srcRow, rn, cellsXml) {
  const a = srcRow ? dropAttr(dropAttr(srcRow.a, "r"), "spans") : "";
  return `<row r="${rn}"${a}>${cellsXml}</row>`;
}
function sheetDoc(T, body, lastCol, lastRow) {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n${T.head}<dimension ref="A1:${colName(Math.max(lastCol, 0))}${Math.max(lastRow, 1)}"/>${T.views}${T.fmt}${T.cols}<sheetData>${body}</sheetData>${T.margins}</worksheet>`;
}
// rawdata(응답시간점검): 선택 시트들을 합쳐 셀 복사
function buildRawXml(R, src) {
  const P = R.parts.map(p => src[p.name]), out = [];
  const tm = R.parts.map(p => p.qTxt);
  // 헤더: 결과 열마다 그 열을 가진 첫 시트의 헤더 셀
  const hcells = [];
  for (let t = 0; t < R.header.length; t++) {
    const pi = R.parts.findIndex(p => p.map.includes(t)); const p = R.parts[pi];
    const cell = P[pi].rows.get(p.hdrRow)?.cells.get(p.baseC + p.map.indexOf(t));
    if (cell) hcells.push(cellXml(cell, colName(t) + 1));
  }
  out.push(rowXml(P[0].rows.get(R.parts[0].hdrRow), 1, hcells.join("")));
  R.meta.forEach((m, i) => {
    const p = R.parts[m.p], srcRow = P[m.p].rows.get(m.r), rn = i + 2, cells = [];
    let hasQ = false;
    if (srcRow) for (const [cn, cell] of srcRow.cells) {
      const t = p.map[cn - p.baseC]; if (t === undefined || t < 0) continue;
      if (t === R.iQdel) { hasQ = true; cells.push([t, cellXml(cell, colName(t) + rn, R.flag[i] === null ? undefined : R.flag[i], tm[m.p])]); }
      else cells.push([t, cellXml(cell, colName(t) + rn)]);
    }
    if (!hasQ && R.flag[i] !== null) cells.push([R.iQdel, cellXml(null, colName(R.iQdel) + rn, R.flag[i], tm[m.p])]);
    cells.sort((x, y) => x[0] - y[0]);
    out.push(rowXml(srcRow, rn, cells.map(c => c[1]).join("")));
  });
  return sheetDoc(P[0], out.join(""), R.header.length - 1, R.meta.length + 1);
}
// PreprocessingData(응답시간점검): 원본 시트 그대로, 응답자 행의 qdel 셀만 교체
function buildPpXml(pp, T) {
  const tm = pp.qTxt;
  const out = []; let lastCol = 0, lastRow = 1;
  for (const [rn, row] of T.rows) {
    const repl = rn !== pp.hdrRow && pp.byRow.has(rn); const cells = []; let hasQ = false;
    for (const [cn, cell] of row.cells) {
      lastCol = Math.max(lastCol, cn);
      if (repl && cn === pp.qdelCol) { hasQ = true; cells.push([cn, cellXml(cell, colName(cn) + rn, pp.byRow.get(rn) === null ? undefined : pp.byRow.get(rn), tm)]); }
      else cells.push([cn, cellXml(cell, colName(cn) + rn)]);
    }
    if (repl && !hasQ && pp.byRow.get(rn) !== null) cells.push([pp.qdelCol, cellXml(null, colName(pp.qdelCol) + rn, pp.byRow.get(rn), tm)]);
    cells.sort((x, y) => x[0] - y[0]);
    out.push(rowXml(row, rn, cells.map(c => c[1]).join(""))); lastRow = Math.max(lastRow, rn);
  }
  return sheetDoc(T, out.join(""), lastCol, lastRow);
}

async function buildOutput(buf, R) {
  const zip = await JSZip.loadAsync(buf);
  const P = new DOMParser(), S = new XMLSerializer();
  const wbXml = P.parseFromString(await zip.file("xl/workbook.xml").async("string"), "application/xml");
  const relXml = P.parseFromString(await zip.file("xl/_rels/workbook.xml.rels").async("string"), "application/xml");
  const ctXml = P.parseFromString(await zip.file("[Content_Types].xml").async("string"), "application/xml");
  const sheetsEl = wbXml.getElementsByTagNameNS(NS_MAIN, "sheets")[0];
  const existing = Array.from(sheetsEl.getElementsByTagNameNS(NS_MAIN, "sheet"));
  const names = new Set(existing.map(s => s.getAttribute("name")));
  let maxId = Math.max(0, ...existing.map(s => +s.getAttribute("sheetId") || 0));
  const rels = Array.from(relXml.getElementsByTagNameNS(NS_PKG, "Relationship"));
  let maxR = Math.max(0, ...rels.map(r => +(String(r.getAttribute("Id")).replace(/\D/g, "")) || 0));
  let fileN = 1; while (zip.file(`xl/worksheets/sheet${fileN}.xml`)) fileN++;

  // 원본 시트 이름 → zip 안 경로
  const pathOf = name => {
    const sh = existing.find(s => s.getAttribute("name") === name); if (!sh) throw new Error(`시트 '${name}'를 zip에서 찾지 못함`);
    const rid = sh.getAttributeNS(NS_R, "id") || sh.getAttribute("r:id");
    const rel = rels.find(r => r.getAttribute("Id") === rid); const t = rel.getAttribute("Target");
    return t.startsWith("/") ? t.slice(1) : "xl/" + t;
  };
  const load = async name => parseSheet(await zip.file(pathOf(name)).async("string"));
  const src = {}; for (const p of R.parts) src[p.name] = await load(p.name);
  const rawXml = buildRawXml(R, src);
  const ppXml = R.pp ? buildPpXml(R.pp, await load(R.pp.name)) : null;

  let added = 0;
  const add = (name, xml) => {
    let nm = name, k = 2; while (names.has(nm)) nm = `${name}_${k++}`; names.add(nm);
    const path = `worksheets/sheet${fileN}.xml`; fileN++;
    zip.file("xl/" + path, xml);
    const rid = "rId" + (++maxR);
    const rel = relXml.createElementNS(NS_PKG, "Relationship");
    rel.setAttribute("Id", rid); rel.setAttribute("Type", T_WS); rel.setAttribute("Target", path);
    relXml.documentElement.appendChild(rel);
    const sh = wbXml.createElementNS(NS_MAIN, "sheet");
    sh.setAttribute("name", nm); sh.setAttribute("sheetId", String(++maxId));
    sh.setAttributeNS(NS_R, "r:id", rid);
    sheetsEl.insertBefore(sh, existing[0] || null);   // 새 시트는 맨 앞 (추가 순서대로)
    added++;
    const ov = ctXml.createElementNS(ctXml.documentElement.namespaceURI, "Override");
    ov.setAttribute("PartName", "/xl/" + path); ov.setAttribute("ContentType", CT_WS);
    ctXml.documentElement.appendChild(ov);
  };
  // 새 rawdata 시트가 열릴 때 선택되도록
  add(OUT_RAW, rawXml.replace(/<sheetView\b/, '<sheetView tabSelected="1"'));
  if (ppXml) add(OUT_PP, ppXml);

  // 시트 순서가 밀린 만큼 위치 기반 참조 보정 + 첫 화면을 새 시트로
  for (const dn of Array.from(wbXml.getElementsByTagNameNS(NS_MAIN, "definedName"))) {
    const id = dn.getAttribute("localSheetId"); if (id !== null) dn.setAttribute("localSheetId", String(+id + added));
  }
  for (const wv of Array.from(wbXml.getElementsByTagNameNS(NS_MAIN, "workbookView"))) {
    wv.setAttribute("activeTab", "0"); wv.removeAttribute("firstSheet");
  }
  // 원본 시트의 '선택됨' 표시만 해제 (여러 시트가 그룹 선택되는 것 방지, 값·서식 무관)
  for (const sh of existing) {
    const f = zip.file(pathOf(sh.getAttribute("name"))); if (!f) continue;
    const x = await f.async("string");
    if (/<sheetView\b[^>]*\stabSelected="1"/.test(x)) zip.file(f.name, x.replace(/(<sheetView\b[^>]*?)\stabSelected="1"/g, "$1"));
  }

  zip.file("xl/workbook.xml", S.serializeToString(wbXml));
  zip.file("xl/_rels/workbook.xml.rels", S.serializeToString(relXml));
  zip.file("[Content_Types].xml", S.serializeToString(ctXml));
  return zip.generateAsync({ type: "blob", compression: "DEFLATE",
    mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
</script>
